<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "utf-8">
    <title>homelessbug.xyz</title>
    <meta name = "description" content = "homelessbug">
    <meta name = "keywords" content = "homelessbug, homelessbug.xyz">
    <link rel = "stylesheet" href = "main.css">
    <script>
        const LINKS_URL = 'https://raw.githubusercontent.com/homelessbug/links/main/links.json';
        fetch(LINKS_URL)
        .then(res => res.json())
        .then(data => {
        document.querySelectorAll('[data-link]').forEach(el => {
        const key = el.getAttribute('data-link');
        const value = key.split('.').reduce((obj, i) => obj && obj[i], data);
        
        if (value) {
          if (el.tagName === 'A') {
            el.href = value;
          } else {
            el.innerText = value;
          }
        }
      });
    })
       .catch(err => console.error('Error fetching links:', err));
    </script>
</head>
<body>
    <div class = "top_main_div">
        <div class = "top_panel">
            <a href = "index.html" class = "nick7red_index">
                <img src = "img/milkchanava.jpg" class = "ava">
                <span class = "homelessbug">homelessbug</span>
            </a>
            <div class = "s8red">
                <a href = "mysocials.html">my socials</a>
                <a href = "https://rvne.org">rvne</a>
                <a href = "supportme.html">support me</a>
            </div>
        </div>

        <div class = "wlc">
            <h1>Welcome to homelessbug.xyz/mysocials</h1>
            <p>Here you can find links to my social media accounts</p>
            <div class = "links">
                <div class="links">
                    <a data-link="socials.discord" class="discord">discord</a>
                    <a data-link="socials.deviantart" class="deviantart">deviantart</a>
                    <a data-link="socials.instagram" class="instagram">instagram</a>
                    <a data-link="socials.x" class="x.com">x.com</a>
                    <a data-link="socials.bluesky" class="bluesky">bluesky</a>
                    <a data-link="email" class="email">email</a>
            </div>
        </div>
    </div>
</body>
</html>

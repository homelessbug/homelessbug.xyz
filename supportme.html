<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "utf-8">
    <title>homelessbug.xyz/supportme</title>
    <meta name = "description" content = "homelessbug">
    <meta name = "keywords" content = "homelessbug, homelessbug.xyz">
    <link rel = "stylesheet" href = "main.css">
    <script>
        const LINKS_URL = 'https://raw.githubusercontent.com/homelessbug/links/main/links.json';
        fetch(LINKS_URL)
        .then(res => res.json())
        .then(data => {
        document.querySelectorAll('[data-link]').forEach(el => {
        const key = el.getAttribute('data-link');
        const value = key.split('.').reduce((obj, i) => obj && obj[i], data);
        
        if (value) {
          if (el.tagName === 'A') {
            el.href = value;
          } else {
            el.innerText = value;
          }
        }
      });
    })
       .catch(err => console.error('Error fetching links:', err));
    </script>
</head>
